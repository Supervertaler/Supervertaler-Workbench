<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervertaler for Trados</title>

<!--
  /trados/ moved to the site root on 2026-08-24.

  Why this page still exists: the RWS App Store listing, the in-plugin help
  and About links, screencast descriptions, past customer emails and any
  external backlink all point at /trados/. Deleting the folder would 404
  every one of them, including the App Store listing we do not control.

  GitHub Pages serves static files only, so the redirect is done three ways:
  a canonical tag (tells search engines where the page went), a meta refresh
  (works with JS disabled), and a visible link (works if both are blocked).
-->

<link rel="canonical" href="https://supervertaler.com/">
<meta http-equiv="refresh" content="0; url=/">
<meta name="robots" content="noindex, follow">

<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 1.5rem;
    text-align: center; line-height: 1.6;
  }
  .card { max-width: 32rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: 0; color: #555; }
  @media (prefers-color-scheme: dark) { p { color: #aaa; } }
  a { color: #2563eb; }
</style>
</head>
<body>
  <div class="card">
    <h1>Supervertaler for Trados</h1>
    <p>This page has moved to <a href="/">supervertaler.com</a>.</p>
  </div>
  <script>location.replace("/");</script>
</body>
</html>
